<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Diagnóstico do topo (iPhone)</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Helvetica,Arial,sans-serif;background:#4d1520;color:#fff;
       padding-top:calc(70px + env(safe-area-inset-top,0px))}
  /* barra fixa igual à do site: cor creme, colada em top:0 */
  #barra{position:fixed;top:0;left:0;right:0;z-index:10;background:#fdf9f4;color:#4d1520;
         padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));font-weight:700}
  #sonda{position:absolute;visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  main{padding:16px}
  pre{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5;background:rgba(255,255,255,.12);padding:12px;border-radius:8px}
  .bloco{height:520px;margin:14px 0;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px}
  .a{background:#8a2d3a}.b{background:#c89a3a;color:#3d1f10}.c{background:#2e7d57}
</style>
</head>
<body>
<div id="barra">Barra fixa (top:0)</div>
<div id="sonda"></div>
<main>
  <p><b>Teste do topo do iPhone.</b> Role esta página para baixo e para cima e tire um print enquanto rola, com a barra de cima aparecendo.</p>
  <pre id="dados">carregando…</pre>
  <div class="bloco a">bloco 1</div>
  <div class="bloco b">bloco 2</div>
  <div class="bloco c">bloco 3</div>
  <div class="bloco a">bloco 4</div>
  <div class="bloco b">bloco 5</div>
</main>
<script>
function atualiza(){
  var s = document.getElementById('sonda');
  var cs = getComputedStyle(s);
  var vv = window.visualViewport;
  var b = document.getElementById('barra').getBoundingClientRect();
  var linhas = [
    'versão do teste: 2026-10-26 a',
    'aparelho: ' + navigator.userAgent,
    'largura da janela: ' + innerWidth + ' px',
    'altura da janela: ' + innerHeight + ' px',
    'altura visual (visualViewport): ' + (vv ? Math.round(vv.height) : 'n/d') + ' px',
    'deslocamento visual do topo: ' + (vv ? Math.round(vv.offsetTop) : 'n/d') + ' px',
    'ÁREA SEGURA de cima: ' + cs.paddingTop,
    'ÁREA SEGURA de baixo: ' + cs.paddingBottom,
    'barra fixa começa em y = ' + Math.round(b.top) + ' px  (deveria ser 0)',
    'altura da barra: ' + Math.round(b.height) + ' px',
    'rolagem: ' + Math.round(scrollY) + ' px',
    'modo instalado (tela inicial): ' + (navigator.standalone === true ? 'sim' : 'não')
  ];
  document.getElementById('dados').textContent = linhas.join('\n');
}
addEventListener('scroll', atualiza, {passive:true});
addEventListener('resize', atualiza);
if (window.visualViewport) { visualViewport.addEventListener('resize', atualiza); visualViewport.addEventListener('scroll', atualiza); }
atualiza();
</script>
</body>
</html>
